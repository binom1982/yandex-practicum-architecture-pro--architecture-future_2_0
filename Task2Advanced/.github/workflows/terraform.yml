name: "Terraform CI/CD Pipeline"

on:
  push:
    branches:
      - main
    paths:
      - "Task2Advanced/**"
  pull_request:
    branches:
      - main
    paths:
      - "Task2Advanced/**"
  workflow_dispatch:  # Позволяет запускать пайплайн вручную из UI

permissions:
  contents: read
  pull-requests: write  # Для комментирования PR с результатами plan

env:
  TF_WORKING_DIR: "Task2Advanced"
  TF_VERSION: "1.7.0"
  TF_VAR_yc_token: ${{ secrets.YC_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  # ============================================================
  # JOB 1: terraform init + terraform plan
  # Запускается автоматически при push/PR
  # ============================================================
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    
    outputs:
      tf_plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      # 1. Клонирование репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Установка Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # 3. terraform init — инициализация провайдеров и backend
      - name: Terraform Init
        id: init
        run: terraform init -input=false
        env:
          TF_VAR_yc_token: ${{ secrets.YC_TOKEN }}

      # 4. terraform fmt — проверка форматирования
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      # 5. terraform validate — валидация конфигурации
      - name: Terraform Validate
        run: terraform validate

      # 6. terraform plan — построение плана изменений
      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -out=tfplan -detailed-exitcode
          echo "exitcode=$?" >> $GITHUB_OUTPUT
        env:
          TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      # 7. Сохранение плана как артефакт (для передачи в job apply)
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 5

      # 8. (Опционально) Комментирование PR с результатами plan
      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const plan = `#### Terraform Plan Results
            **Exit Code:** ${{ steps.plan.outputs.exitcode }}
            **Working Directory:** \`${{ env.TF_WORKING_DIR }}\`
            
            *План создан. Проверьте артефакты для деталей.*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: plan
            });

  # ============================================================
  # JOB 2: terraform apply
  # Требует ручного подтверждения (manual approval)
  # ============================================================
  apply:
    name: "Terraform Apply"
    needs: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    
    # GitHub Environment — позволяет настроить manual approval
    environment:
      name: production
      url: https://console.yandex.cloud/

    # Запускается ТОЛЬКО:
    # - если plan завершился успешно (exitcode != 2 означает ошибку)
    # - И если это push в main (не PR, чтобы не применять изменения из PR автоматически)
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.plan.outputs.tf_plan_exitcode != '2'

    steps:
      # 1. Клонирование репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Установка Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # 3. terraform init (нужно повторить, т.к. каждый job — чистый runner)
      - name: Terraform Init
        run: terraform init -input=false
        env:
          TF_VAR_yc_token: ${{ secrets.YC_TOKEN }}

      # 4. Скачивание плана из артефакта
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      # 5. terraform apply — применение плана
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
        env:
          TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}